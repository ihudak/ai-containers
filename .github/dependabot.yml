# Base images in Dockerfile and Dockerfile.seed. Dependabot reads every file
# whose name contains "dockerfile", so the seed image is covered too.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new Ubuntu LTS is a platform migration, made on purpose, not a bump.
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major"]
