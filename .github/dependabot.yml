# Base images in Dockerfile and Dockerfile.seed. Dependabot reads every file
# whose name contains "dockerfile", so the seed image is covered too.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Ubuntu is never bumped automatically. Dependabot reads 24.04 -> 24.10 as
      # a minor update, but 24.10 is a 9-month interim release (end of life, its
      # archive gone), and moving to a new LTS is a migration made on purpose.
      # The 24.04 tag itself is republished with security fixes.
      - dependency-name: ubuntu
