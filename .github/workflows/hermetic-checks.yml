name: Hermetic checks

# The PR gate and the nightly run must execute the SAME hermetic checks, or the
# documented contract `local ⊇ nightly ⊇ PR` is false over checks even while it
# holds over integration cases — which is exactly what it was until this file
# existed. Defining the jobs once and calling them from both workflows is the
# only arrangement that cannot drift; copying them into nightly.yml would create
# a second list to keep in step, the failure this repo keeps getting bitten by
# (shared-files.sh, the CHECKS table, the mgd byte-identity gate).
#
# tests/test-layer-containment.sh reads THIS file: every step below must be
# either a `check` row in tests/layer-checks.conf (with a stub and a witness
# proving it also runs locally) or a `setup` row declaring why it is not a
# check. A step that is neither fails that test.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  suite:
    name: Shell test suite
    runs-on: ubuntu-latest

    steps:
      # Full history: check-sandbox-version.sh compares sandbox.conf against a
      # base ref, so a shallow clone would leave it nothing to diff.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Show bash version
        run: bash --version | head -1

      # The suite drives project-init.sh / sync-to-projects.sh, which rsync the
      # repo into throwaway dirs. Present on GitHub runners, guarded anyway.
      - name: Ensure rsync is available
        run: command -v rsync >/dev/null || (sudo apt-get update && sudo apt-get install -y rsync)

      - name: Run tests
        run: ./tests/run-all.sh

      # The documented CI gate against a SILENT semantic sandbox.conf change.
      # BASE_REF must predate the change under review: the script's default HEAD
      # only detects an UNCOMMITTED edit and silently no-ops in CI.
      - name: sandbox.conf schema gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # The whole push, not just its last commit: HEAD^ would diff only the
            # newest commit and miss a key removed earlier in the same push.
            # event.before is all-zeros for a new branch and stale after a force
            # push, so fall back to HEAD^ when it is not a reachable commit.
            base="${{ github.event.before }}"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="HEAD^"
            fi
          fi
          echo "diffing sandbox.conf against $base"
          BASE_REF="$base" ./check-sandbox-version.sh --check

  suite-floor:
    name: Shell test suite (bash floor)
    runs-on: ubuntu-latest
    # ubuntu:22.04 ships bash 5.1.16 — the declared floor — with GNU coreutils.
    # `suite` above runs on whatever bash ubuntu-latest happens to ship, which
    # drifts upward with the runner image; this job pins the CLAIM. Raising the
    # floor means changing this image and bash-floor.sh together.
    container: ubuntu:22.04

    steps:
      # BEFORE checkout: actions/checkout needs git inside the container, and
      # without it silently falls back to a REST download with no .git — which
      # tests/test-mutations.sh detects and fails on (it needs a git work tree
      # for `git apply --check`). rsync is needed by the project-init tests.
      - name: Install git and rsync
        run: apt-get update -qq && apt-get install -y -qq git rsync ca-certificates

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A container job's workspace is prepared by the RUNNER process on the
      # host (uid 1001), then bind-mounted into this container, where every
      # step (including this one) runs as root (uid 0, ubuntu:22.04's default
      # user) — the same "same UID for the clone and the process" assumption
      # verify-on-host.sh's floor container already had to solve for the
      # bind-mounted host repo (see its Phase 5 comment), except here it's
      # git >= 2.35.2's dubious-ownership check tripping over the runner/root
      # UID mismatch instead of a macOS virtiofs one. Scoped to
      # $GITHUB_WORKSPACE (this job's actual checkout path, e.g.
      # /__w/ai-containers/ai-containers) rather than `*`: this container is
      # single-purpose for this job, but a wildcard would still trust more
      # than this step could ever need.
      - name: "Trust the checkout: container job's workspace is owned by the runner, not this container's root"
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Show bash version
        run: bash --version | head -1

      - name: Run tests at the declared floor
        run: ./tests/run-all.sh

  falsify:
    name: Mutation tier (falsify) + survivor-ledger ratchet
    runs-on: ubuntu-latest
    # 249 mutants over 9 targets: ~3.4 min at --jobs 6 / --timeout 60 on a
    # 12-core machine. Eleven of those mutants time out BY CONSTRUCTION (they
    # damage a read loop into never terminating), so --timeout is a straight
    # multiplier on wall clock rather than a ceiling nothing reaches: at
    # --timeout 120 those eleven alone cost 1320 worker-seconds. 45 minutes is
    # headroom over a slow 2-4 vCPU runner, not an estimate of the run.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      # test-shared-files-parity.sh — the oracle for the shared-files.sh target
      # — drives sync-to-projects.sh, which rsyncs into a throwaway dir. Present
      # on GitHub runners, guarded anyway, exactly as the `suite` job does.
      - name: Ensure rsync is available
        run: command -v rsync >/dev/null || (sudo apt-get update && sudo apt-get install -y rsync)

      # ── WHY THIS RUNS THE CORPUS INSTEAD OF CHECKING A COMMITTED RUN ────────
      # check-ledger.sh scores the ledger against ONE run output, and that is
      # the whole difficulty (backlog F24). Adding the assertion that kills a
      # survivor does not change a RECORDED run, so the entry excusing it would
      # stay "required" while describing a closed gap; and regenerating the
      # record to drop that one entry re-scores every OTHER entry at the same
      # time. Freezing a run artefact in the repo would make the gate check a
      # historical measurement of a tree that no longer exists — the
      # assert-configuration-not-effect failure this repo keeps closing.
      #
      # So the run and the check are ONE operation on the commit under review.
      # Re-scoring every entry is then not an accident to be avoided but the
      # normal case, on every run, which is the only circumstance in which the
      # ledger is ever actually true. A fix and its ledger edit land in one
      # commit and CI re-derives both halves: forget to delete the entry and
      # check D (obsolete amnesty) fails; delete it without the fix and check B
      # (a survivor with no entry) fails.
      #
      # --timeout 120, not the 60 default: UNPROVEN is "the oracle timed out
      # without ever printing FAIL:", so a machine slow enough turns a KILL into
      # an unclassified survivor and fails this gate for a reason that is not
      # about the tree. The slowest legitimate mutant measured 14.1 s, so 120
      # leaves ~8x for a loaded shared runner. No --target, no --operators: the
      # scope rule makes the stale/obsolete checks vacuous for any file a
      # partial run did not measure, so this gate is only honest over the whole
      # corpus.
      - name: Run the falsify mutation corpus
        run: |
          rc=0
          bash tests/falsify/run.sh --jobs "$(nproc)" --timeout 120 \
            > "$RUNNER_TEMP/falsify-run.txt" || rc=$?
          # run.sh's STDOUT is the record the ratchet reads; its EXIT STATUS is
          # a separate signal (an oracle not green on the pristine tree, a
          # worker that produced no verdict) that a `run.sh | check-ledger.sh -`
          # pipeline would discard. Both are honoured: the summary is echoed for
          # a human reading the log, and a non-zero corpus fails this step
          # before the ratchet is given output it cannot be trusted to score.
          grep -E '^(TARGET|TOTAL)\|' "$RUNNER_TEMP/falsify-run.txt" || true
          echo "corpus exit: $rc"
          exit "$rc"

      - name: Survivor-ledger ratchet
        run: |
          bash tests/falsify/check-ledger.sh \
            --run-output "$RUNNER_TEMP/falsify-run.txt" \
            --ledger tests/falsify/survivors.txt

  lint:
    name: Shell lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Parse every script, including the integration harness and its cases. A
      # syntax error in a case would otherwise surface minutes into a container
      # run as a mysterious runtime failure, after paying for an image build.
      - name: bash -n over every script
        run: |
          rc=0
          n=0
          while IFS= read -r f; do
            n=$((n + 1))
            bash -n "$f" || { echo "PARSE ERROR: $f"; rc=1; }
          done < <(git ls-files '*.sh')
          # A lint job that parsed nothing must not report success: a changed
          # pathspec or a repo reorganisation would silently turn this into a
          # no-op that still goes green.
          if [ "$n" -eq 0 ]; then
            echo "::error::git ls-files '*.sh' matched no files — nothing was parsed"
            exit 1
          fi
          echo "parsed $n script(s)"
          exit $rc

      # The floor is 5.1 while CI runs 5.2 and a developer's Mac runs 5.3.
      # Nothing else compares them, so this is the only thing standing between
      # a comfortable ${ cmd; } on the host and a container that will not start.
      - name: bash dialect (nothing newer than the declared floor)
        run: ./tests/bash-dialect-lint.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # -e SC1091: sourced paths are resolved at runtime, not by the linter.
          # GATE: increment 4 cleared the pre-existing findings backlog (fixed
          # the real defects, suppressed the rest at the site with a reason —
          # see git history for "clear the shellcheck backlog and gate on it")
          # and promoted this from advisory to blocking. verify-on-host.sh
          # Phase 7 runs this identical command locally.
          git ls-files '*.sh' | xargs shellcheck -S warning -e SC1091
