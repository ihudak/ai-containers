name: Integration

# TEMPORARY: `push: branches: [integration-suite]` exists only so Task 3 can
# iterate — this repo's gh identity (ivan-gudak) is not a collaborator on
# ihudak/ai-containers, so `gh workflow run` / `gh pr create` both fail with
# "must be a collaborator". A plain `git push` over SSH (a different,
# authorized identity) DOES trigger workflows, so the push trigger is the only
# available iteration mechanism until this lands as a PR. Task 11 narrows this
# trigger to `pull_request` + `push` on `main` once the corpus is green — if
# you are reading this on `main`, that narrowing did not happen; fix it.
on:
  push:
    branches:
      - integration-suite
  pull_request:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Comma-separated tags to select (blank = all)'
        required: false
        default: 'fast'
      exclude:
        description: 'Comma-separated tags to exclude'
        required: false
        default: 'needs-external,needs-dns'
      require:
        description: 'Comma-separated tags whose skip fails the run'
        required: false
        default: 'security'
      verbose:
        description: 'Stream each case output'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  integration:
    name: Integration cases
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Environment
        run: |
          uname -a
          docker --version
          df -h / | tail -1
          # The security tier rests on these two being loadable.
          sudo modprobe ip_set        && echo "ip_set OK"        || echo "ip_set UNAVAILABLE"
          sudo modprobe nfnetlink_log && echo "nfnetlink_log OK" || echo "nfnetlink_log UNAVAILABLE"

      - name: Detected capabilities
        run: ./tests/integration/run.sh --list-caps

      - name: Case corpus
        run: ./tests/integration/run.sh --list

      - name: Pull base image (with retry)
        run: |
          # Run 31108437390 died before a single case ran: `docker build`'s
          # first layer is a `docker pull` from Docker Hub, and Hub timed out
          # resolving ubuntu:24.04's manifest ("dial tcp …: i/o timeout"). That
          # is a registry flake, not a test failure, but it still cost a full
          # ~6-minute round trip and read as a red build someone had to
          # diagnose before dismissing. Pre-pulling the base image HERE, with
          # its own short retry, is cheap and isolates the flake from the
          # build: if this step is the one that fails, the cause is obviously
          # "the registry", never "something in this suite or the Dockerfile".
          # Deliberately NOT wrapping `docker build` itself in a retry (see
          # build_image() in run.sh) — that would just as happily hide a
          # genuine Dockerfile break behind "flaky, try again".
          #
          # Parsed from the Dockerfile's own FROM line, not hardcoded: a
          # hardcoded tag keeps "succeeding" even after the real base image
          # changes, silently pre-warming the wrong image.
          base_image="$(grep -m1 '^FROM' Dockerfile | awk '{print $2}')"
          if [ -z "$base_image" ]; then
            echo "::error::could not parse a FROM line out of Dockerfile — nothing to pre-pull"
            exit 1
          fi
          echo "pre-pulling base image: $base_image"
          ok=0
          for attempt in 1 2 3; do
            if docker pull "$base_image"; then
              ok=1
              break
            fi
            echo "pull attempt $attempt/3 failed for $base_image"
            [ "$attempt" -lt 3 ] && sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::failed to pull $base_image after 3 attempts — this is a registry availability problem (Docker Hub), not a failure in this test suite. Re-run the job once the registry recovers."
            exit 1
          fi

      - name: Run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args=""
            [ -n "${{ inputs.tags }}" ]    && args="$args --tags ${{ inputs.tags }}"
            [ -n "${{ inputs.exclude }}" ] && args="$args --exclude ${{ inputs.exclude }}"
            [ -n "${{ inputs.require }}" ] && args="$args --require ${{ inputs.require }}"
            [ "${{ inputs.verbose }}" = "true" ] && args="$args -v"
          else
            # push/pull_request do NOT populate the `inputs` context — it is
            # only set for workflow_dispatch — so `${{ inputs.exclude }}` and
            # `${{ inputs.require }}` are empty strings here, NOT the declared
            # defaults ("needs-external,needs-dns" / "security"). Relying on
            # those defaults on this branch silently drops --require security
            # the moment a security-tagged case exists: a SKIPped security
            # case would pass the build instead of failing it. push is also
            # currently the ONLY trigger that fires here (see the temporary-
            # trigger note above), so this is not a future concern — it is
            # today's gate. Spell the gate arguments out explicitly instead of
            # trusting the workflow_dispatch defaults to carry over; do not
            # "simplify" this back to reading inputs.* unconditionally.
            args="--tags fast --exclude needs-external,needs-dns --require security"
          fi
          echo "run.sh $args"
          ./tests/integration/run.sh $args

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/it-diag
          cp -r "$HOME/.cache/ai-containers-it" /tmp/it-diag/ 2>/dev/null || true
          docker ps -a --filter 'label=ai-containers.it-run' > /tmp/it-diag/containers.txt 2>&1 || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: it-diagnostics-${{ github.run_id }}
          path: /tmp/it-diag
          retention-days: 7

      - name: Sweep
        if: always()
        run: |
          docker ps -aq  --filter 'label=ai-containers.it-run' | xargs -r docker rm -f
          docker network ls -q --filter 'label=ai-containers.it-run' | xargs -r docker network rm
