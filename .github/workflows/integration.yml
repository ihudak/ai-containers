name: Integration

# Runs the `fast` tier on every PR and on pushes to main. The whole corpus —
# including the `slow` and `needs-dns` cases excluded here on cost — runs
# nightly, so a case excluded on cost is still a case that runs.
# `pull_request` + `push: main`, deliberately — NOT a branch-specific push
# trigger. During development this ran on `push: integration-suite`, which was
# the only way to exercise CI before a PR existed (this session's gh identity is
# not a collaborator, so `gh workflow run` and `gh pr create` both fail). Once a
# PR is open, `pull_request` covers the same commits, and keeping both would
# double-fire every push for identical coverage — and would leave dead config on
# main naming a branch that no longer exists.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Comma-separated tags to select (blank = all)'
        required: false
        default: 'fast'
      exclude:
        description: 'Comma-separated tags to exclude'
        required: false
        default: 'needs-external,needs-dns'
      require:
        description: 'Comma-separated tags whose skip fails the run'
        required: false
        default: 'security'
      verbose:
        description: 'Stream each case output'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  integration:
    name: Integration cases
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Environment
        run: |
          uname -a
          docker --version
          df -h / | tail -1
          # The security tier rests on these two being loadable.
          sudo modprobe ip_set        && echo "ip_set OK"        || echo "ip_set UNAVAILABLE"
          sudo modprobe nfnetlink_log && echo "nfnetlink_log OK" || echo "nfnetlink_log UNAVAILABLE"

      - name: Detected capabilities
        run: ./tests/integration/run.sh --list-caps

      - name: Case corpus
        run: ./tests/integration/run.sh --list

      - name: Pull base image (with retry)
        run: |
          # Run 31108437390 died before a single case ran: `docker build`'s
          # first layer is a `docker pull` from Docker Hub, and Hub timed out
          # resolving ubuntu:24.04's manifest ("dial tcp …: i/o timeout"). That
          # is a registry flake, not a test failure, but it still cost a full
          # ~6-minute round trip and read as a red build someone had to
          # diagnose before dismissing. Pre-pulling the base image HERE, with
          # its own short retry, is cheap and isolates the flake from the
          # build: if this step is the one that fails, the cause is obviously
          # "the registry", never "something in this suite or the Dockerfile".
          # Deliberately NOT wrapping `docker build` itself in a retry (see
          # build_image() in run.sh) — that would just as happily hide a
          # genuine Dockerfile break behind "flaky, try again".
          #
          # Parsed from the Dockerfile's own FROM line, not hardcoded: a
          # hardcoded tag keeps "succeeding" even after the real base image
          # changes, silently pre-warming the wrong image.
          # Layout-tolerant, exactly like run.sh/lib.sh: ai-containers keeps the
          # engine at the repo root, mgd-ai-containers keeps it in base/. This
          # step hardcoded `Dockerfile` and so died before anything ran in the
          # base/ layout — "grep: Dockerfile: No such file or directory". One
          # workflow file must serve both repos or it drifts, which is the same
          # reasoning that made run.sh resolve IT_REPO_DIR with a fallback.
          dockerfile=Dockerfile
          [ -f "$dockerfile" ] || dockerfile=base/Dockerfile
          if [ ! -f "$dockerfile" ]; then
            echo "::error::no Dockerfile at the repo root or in base/"
            exit 1
          fi
          base_image="$(grep -m1 '^FROM' "$dockerfile" | awk '{print $2}')"
          # An ARG-substituted FROM (e.g. `FROM ${BASE_IMAGE}`) parses to the
          # LITERAL, unexpanded token — non-empty, so a plain -z check passes it
          # through, and `docker pull '${BASE_IMAGE}'` then fails three times and
          # gets reported as "a REGISTRY problem", which is exactly wrong. Refuse
          # a value we cannot pull rather than misattributing the failure.
          case "$base_image" in
            *'$'*|*'{'*)
              echo "::error::the Dockerfile's FROM line is variable-substituted ($base_image) — this step cannot resolve it; teach it the ARG default or drop the pre-pull"
              exit 1
              ;;
          esac
          if [ -z "$base_image" ]; then
            echo "::error::could not parse a FROM line out of Dockerfile — nothing to pre-pull"
            exit 1
          fi
          echo "pre-pulling base image: $base_image"
          ok=0
          for attempt in 1 2 3; do
            if docker pull "$base_image"; then
              ok=1
              break
            fi
            echo "pull attempt $attempt/3 failed for $base_image"
            [ "$attempt" -lt 3 ] && sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::failed to pull $base_image after 3 attempts — this is a registry availability problem (Docker Hub), not a failure in this test suite. Re-run the job once the registry recovers."
            exit 1
          fi

      - name: Run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # `packages` is excluded UNCONDITIONALLY here, appended to whatever
            # the caller typed rather than replacing it — a user-supplied
            # exclude must never be silently dropped, and neither must this one.
            #
            # The packages tier does not belong to this job at all: it is
            # nightly.yml's, which runs it as two dedicated jobs
            # (packages-agents / packages-native) with their own multi-hour
            # timeouts, precisely because the tier's own declared budgets are
            # ~108 min (agents) + ~322 min (native). This job is capped at
            # timeout-minutes: 45. Blanking the `tags` input — a perfectly
            # ordinary thing to do, since blank is documented as "all" —
            # otherwise selects all 34 cases and builds all three variant
            # images here, and the job dies at the OUTER timeout reporting
            # nothing about the fast tier it exists for: exactly the ambiguous
            # kill the per-case `timeout:` headers were added to prevent,
            # recreated one layer up. nightly.yml's own integration-full job
            # bakes the same exclusion for the same reason.
            excl="packages"
            [ -n "${{ inputs.exclude }}" ] && excl="${{ inputs.exclude }},packages"
            args=""
            [ -n "${{ inputs.tags }}" ]    && args="$args --tags ${{ inputs.tags }}"
            args="$args --exclude $excl"
            [ -n "${{ inputs.require }}" ] && args="$args --require ${{ inputs.require }}"
            [ "${{ inputs.verbose }}" = "true" ] && args="$args -v"
          else
            # push/pull_request do NOT populate the `inputs` context — it is
            # only set for workflow_dispatch — so `${{ inputs.exclude }}` and
            # `${{ inputs.require }}` are empty strings here, NOT the declared
            # defaults ("needs-external,needs-dns" / "security"). Relying on
            # those defaults on this branch silently drops --require security
            # the moment a security-tagged case exists: a SKIPped security
            # case would pass the build instead of failing it. push is also
            # currently the ONLY trigger that fires here (see the temporary-
            # trigger note above), so this is not a future concern — it is
            # today's gate. Spell the gate arguments out explicitly instead of
            # trusting the workflow_dispatch defaults to carry over; do not
            # "simplify" this back to reading inputs.* unconditionally.
            args="--tags fast --exclude needs-external,needs-dns --require security"
          fi
          echo "run.sh $args"
          ./tests/integration/run.sh $args

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/it-diag
          cp -r "$HOME/.cache/ai-containers-it" /tmp/it-diag/ 2>/dev/null || true
          docker ps -a --filter 'label=ai-containers.it-run' > /tmp/it-diag/containers.txt 2>&1 || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: it-diagnostics-${{ github.run_id }}
          path: /tmp/it-diag
          retention-days: 7

      - name: Sweep
        if: always()
        run: |
          docker ps -aq  --filter 'label=ai-containers.it-run' | xargs -r docker rm -f
          # Volumes too: the launcher tier creates them on its own (a group's rvm
          # volume, a :rwcopy working copy) and they are the only leaked resource
          # here measured in GB. Label-scoped, so nothing outside this run matches.
          docker volume ls -q --filter 'label=ai-containers.it-run' | xargs -r docker volume rm
          docker network ls -q --filter 'label=ai-containers.it-run' | xargs -r docker network rm
