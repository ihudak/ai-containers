name: Nightly

# Non-blocking but LOUD. Everything too slow, too external, or too expensive for
# the PR gate runs here — so a case excluded on cost is still a case that RUNS.
#
# This workflow is not a nicety. The PR gate selects `--tags fast`, which today
# excludes 3 of the 16 integration cases: 120-discovery-collects (slow), and
# 080/085-selfheal-* (needs-dns). All three are verified, but until this file
# exists they are verified ONCE and never again — any later change to
# capture-agent-destinations.sh, its tcpdump filter, or the self-healing path in
# capture-blocked-traffic.sh would be unguarded. "Excluded on cost" quietly
# becoming "never checked" is the same failure this whole suite exists to close,
# relocated from a case to a schedule.
on:
  schedule:
    - cron: '17 3 * * *'
  # tags/exclude exist for mutation demonstrations: proving a new case actually
  # fails against the known-bad configuration it targets needs ONE tier run
  # against a deliberately broken tree, not the whole corpus. Without a filter
  # here, every demonstration also re-runs integration-full and
  # allowlist-health for no benefit — up to two hours each, times as many
  # dispatches as there are mutations to demonstrate. Both inputs default to
  # empty, which is exactly what the scheduled run supplies, so a scheduled
  # run's rendered command is unchanged.
  workflow_dispatch:
    inputs:
      tags:
        description: 'run.sh --tags for the integration jobs (empty = the whole corpus)'
        required: false
        default: ''
      exclude:
        description: 'run.sh --exclude for the integration jobs'
        required: false
        default: ''
      # Unlike tags/exclude above (integration-full only), this feeds the
      # packages-agents/packages-native jobs, whose own selection is otherwise
      # hardcoded (`--tags packages --variant <name>`) and reads no input at
      # all — every case sharing that variant runs on every dispatch,
      # regardless of which mutation.patch is applied to the tree. A mutation
      # demonstration needs to isolate the ONE case its patch targets: some of
      # these patches are global (e.g. entrypoint.sh's link_agent_tools /
      # link_default_ruby, sandbox-common.sh's rvm_volume_name) and their
      # effect on a co-running, unpatched neighbour must be either avoided or
      # deliberately controlled for, not left to chance. Empty (the default)
      # is a no-op — both jobs render their existing hardcoded command
      # unchanged, exactly like tags/exclude above.
      cases:
        description: 'run.sh --cases for the packages-agents/packages-native jobs (e.g. 760-ruby-persists-no-recompile) — empty = every packages case for that variant'
        required: false
        default: ''
      # Task 11c: this ONE value is threaded into BOTH jobs below, unfiltered —
      # neither has (or needs) a job-level `if:` naming which case belongs to
      # which variant. A dispatch plan built around one variant's case names
      # (e.g. cases=700-agent-tools-install-restricted, an agents-tier case)
      # therefore also reaches packages-native as
      # `--variant native --cases 700-agent-tools-install-restricted`. run.sh
      # itself resolves that: the name is real (case_variant() knows it), it
      # just belongs to the sibling job's variant, so that job exits 0 with an
      # explicit "nothing to run here, a sibling job covers it" message rather
      # than the FATAL zero-selection guard a typo or bad tag would still hit.
      # Encoding "which case belongs to which variant" here in YAML instead
      # would duplicate the one place that already knows it — run.sh's own
      # case_variant() — and would drift the moment a case's `image:` header
      # changed without this file being touched.

permissions:
  contents: read

jobs:
  # The same hermetic checks the PR gate runs, so `local ⊇ nightly ⊇ PR` holds
  # over CHECKS and not only over integration cases. ~2¼ runner-minutes.
  #
  # Schedule only. The workflow_dispatch inputs above exist for MUTATION
  # DEMONSTRATIONS, which deliberately break production files to prove a case
  # fails against a known-bad tree; run-all.sh would go red there for reasons
  # that have nothing to do with what the demonstration is proving, burying the
  # signal the dispatch was run to produce. The containment invariant concerns
  # the SCHEDULED nightly layer, so gating this costs the invariant nothing.
  # tests/test-layer-containment.sh pins this exact condition — `if: false`
  # cannot be substituted for it.
  hermetic:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/hermetic-checks.yml

  integration-full:
    name: Integration — everything
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Skip ONLY the one input shape the baked `--exclude packages` below turns
    # into a guaranteed-empty selection: a dispatch of tags=packages exactly.
    # With that exclude baked in, `--tags packages --exclude packages` selects
    # ZERO cases, and run.sh treats zero selection as FATAL BY DESIGN — the
    # same guard that stops a mistyped --tags from passing silently (see
    # run.sh's own "A run that selected NOTHING is not a pass" comment). That
    # guard firing here would not mean anything is broken; it would mean this
    # job and the dispatcher agreed to select nothing, and the failure would
    # read as a broken corpus rather than as the redundant-request it is —
    # packages-agents and packages-native already run exactly that selection,
    # in full, every night. Skipping is not `continue-on-error`: the job
    # simply never claims to have checked anything, which is the honest
    # report for "coverage lives in the two dedicated jobs instead".
    # Unaffected by schedule/push triggers or any other dispatch value:
    # `inputs.tags` there is empty (falsy), never the literal string
    # 'packages', so this condition is true and the job runs normally — same
    # evaluates-to-empty behaviour Task 10 already verified for the tags/
    # exclude expressions below.
    if: ${{ inputs.tags != 'packages' }}
    steps:
      - uses: actions/checkout@v5

      # Same rationale as integration.yml: `docker build`'s first layer is a pull
      # from Docker Hub, and Hub timing out reads as a red build someone has to
      # diagnose before dismissing. Isolate the flake from the build.
      - name: Pull base image (with retry)
        run: |
          # Layout-tolerant, exactly like run.sh/lib.sh: ai-containers keeps the
          # engine at the repo root, mgd-ai-containers keeps it in base/. This
          # step hardcoded `Dockerfile` and so died before anything ran in the
          # base/ layout — "grep: Dockerfile: No such file or directory". One
          # workflow file must serve both repos or it drifts, which is the same
          # reasoning that made run.sh resolve IT_REPO_DIR with a fallback.
          dockerfile=Dockerfile
          [ -f "$dockerfile" ] || dockerfile=base/Dockerfile
          if [ ! -f "$dockerfile" ]; then
            echo "::error::no Dockerfile at the repo root or in base/"
            exit 1
          fi
          img="$(grep -m1 '^FROM' "$dockerfile" | awk '{print $2}')"
          # An ARG-substituted FROM (e.g. `FROM ${BASE_IMAGE}`) parses to the
          # LITERAL, unexpanded token — non-empty, so a plain -z check passes it
          # through, and `docker pull '${BASE_IMAGE}'` then fails three times and
          # gets reported as "a REGISTRY problem", which is exactly wrong. Refuse
          # a value we cannot pull rather than misattributing the failure.
          case "$img" in
            *'$'*|*'{'*)
              echo "::error::the Dockerfile's FROM line is variable-substituted ($img) — this step cannot resolve it; teach it the ARG default or drop the pre-pull"
              exit 1
              ;;
          esac
          if [ -z "$img" ]; then
            echo "::error::could not parse a base image from the Dockerfile's FROM line"
            exit 1
          fi
          for i in 1 2 3; do
            docker pull "$img" && exit 0
            echo "pull attempt $i failed; retrying in 10s"
            sleep 10
          done
          echo "::error::could not pull $img after 3 attempts — this is a REGISTRY problem, not a test failure"
          exit 1

      - name: Detected capabilities
        run: ./tests/integration/run.sh --list-caps

      - name: Case corpus
        run: ./tests/integration/run.sh --list

      # `--exclude packages` is BAKED IN, always, not left to inputs.exclude:
      # the packages tier (7 cases, two image variants) is now owned by the
      # packages-agents/packages-native jobs below, which run it in parallel
      # beside this one. Without this exclusion, a scheduled run (no inputs at
      # all) would select those seven cases HERE too, build both new variant
      # images inside this single serial job, and very likely blow
      # `timeout-minutes: 90` on their own — killing the whole corpus run and
      # reporting nothing about the network/mounts/groups/volumes cases this
      # job exists for. `inputs.exclude` still composes ON TOP of the baked
      # exclusion (comma-joined) rather than replacing it, so a dispatcher can
      # still narrow further; they cannot accidentally widen this job back
      # into re-running the packages tier by leaving `exclude` at its default.
      # --require security still applies, so a security case that cannot run
      # here fails the job rather than quietly disappearing from the count.
      - name: Run the whole corpus
        run: >-
          ./tests/integration/run.sh --require security
          ${{ inputs.tags && format('--tags {0}', inputs.tags) || '' }}
          --exclude packages${{ inputs.exclude && format(',{0}', inputs.exclude) || '' }}

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/it-diag
          cp -r "$HOME/.cache/ai-containers-it" /tmp/it-diag/ 2>/dev/null || true
          docker ps -a --filter 'label=ai-containers.it-run' > /tmp/it-diag/containers.txt 2>&1 || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-diagnostics-${{ github.run_id }}
          path: /tmp/it-diag
          retention-days: 7

      - name: Sweep
        if: always()
        run: |
          docker ps -aq  --filter 'label=ai-containers.it-run' | xargs -r docker rm -f
          # Volumes too: the launcher tier creates them on its own (a group's rvm
          # volume, a :rwcopy working copy) and they are the only leaked resource
          # here measured in GB. Label-scoped, so nothing outside this run matches.
          docker volume ls -q --filter 'label=ai-containers.it-run' | xargs -r docker volume rm
          docker network ls -q --filter 'label=ai-containers.it-run' | xargs -r docker network rm

  allowlist-health:
    name: Allowlist fragment health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Fragments rot silently. A domain that stops resolving stays in the file
      # forever, and the only symptom is a tool that mysteriously cannot install
      # behind the firewall — diagnosed, if ever, as "the network is flaky".
      #
      # NOT on the PR gate: it depends on the public internet, so a DNS blip must
      # not block unrelated work. Here a red run is a prompt to look.
      #
      # SCOPE — allowlist-domains.d ONLY, deliberately. An earlier version also
      # checked allowlist-proxy-domains.d by stripping the "*." and resolving the
      # parent, which is a category error: refresh-ipset-allowlist.sh never reads
      # the proxy file at all (grep it — zero references). Those entries are
      # SUFFIX PATTERNS consumed by matches_wildcard_domain() in
      # capture-blocked-traffic.sh, and an apex like dynalabs.io is legitimately
      # NXDOMAIN while *.dynalabs.io hosts resolve fine. That version reported 3
      # false alarms out of 7, and a health check that cries wolf gets ignored —
      # which fails the same way as a check that never fires.
      - name: Every resolved domain still resolves
        run: |
          command -v dig >/dev/null || sudo apt-get install -y -qq bind9-dnsutils
          # A job that scanned NOTHING must not report success. Without this, a
          # renamed directory or a moved fragment set makes the glob match zero
          # files, every loop below is skipped, rc stays 0, and the job goes green
          # having checked nothing — the same "we did not look" false green this
          # suite exists to eliminate, relocated into CI plumbing.
          n_files=$(ls -1 allowlist-domains.d/*.txt 2>/dev/null | wc -l)
          if [ "$n_files" -eq 0 ]; then
            echo "::error::no fragments found in allowlist-domains.d/ — nothing was checked"
            exit 1
          fi
          echo "scanning $n_files fragment file(s)"
          rc=0
          n_hosts=0
          for f in allowlist-domains.d/*.txt; do
            [ -f "$f" ] || continue
            while IFS= read -r host; do
              case "$host" in ''|'#'*) continue ;; esac
              # Docker injects this via --add-host=host.docker.internal:host-gateway,
              # so it resolves inside a container and nowhere else. Not rot.
              [ "$host" = "host.docker.internal" ] && continue
              # NXDOMAIN means the name is GONE. A name that exists without an A
              # record at the apex is not rot, and getent cannot tell the two
              # apart — which is why this uses dig's status rather than getent.
              n_hosts=$((n_hosts + 1))
              if dig +noall +comment "$host" 2>/dev/null | grep -q 'status: NXDOMAIN'; then
                echo "NXDOMAIN: $host  ($f)"; rc=1
              fi
            done < "$f"
          done
          # Same reasoning one level down: files present but every one empty or
          # comments-only would also mean nothing was actually resolved.
          if [ "$n_hosts" -eq 0 ]; then
            echo "::error::found $n_files fragment file(s) but zero hostnames — nothing was checked"
            exit 1
          fi
          echo "checked $n_hosts hostname(s)"
          exit $rc

  # The packages tier verifies that components INSTALL — the seven cases at
  # tests/integration/cases/7[0-6]0-*.sh — through the REAL allowlist, which is
  # why it is nightly and not on the PR gate. It replaces the old verify-on-host.sh
  # Phases 1-3 job: run.sh now drives the same real installs as ordinary
  # integration cases, with named PASS/FAIL/SKIP assertions instead of a
  # pass/fail script. These two jobs are what made removing those phases safe
  # rather than a coverage loss, and the removal has since landed on this branch
  # (eb91065): verify-on-host.sh is now Phase 0 plus Phase 4, and this job's
  # selection is the only place the packages tier runs in CI.
  #
  # TWO jobs, one per image variant (agents: 700/710/720, native:
  # 730/740/750/760), not one job running both. run.sh executes cases SERIALLY
  # within a single job step, and the seven cases' own `timeout:` headers sum to
  # 430 minutes worst case — 2100+2400+2000s (agents) + 3900+3900+3900+7600s
  # (native) — against any single reasonable job timeout. Realistic totals are
  # far lower (roughly 15-30 min agents, 25-50 min native: within one run the
  # rvm/agent-tools volume is shared by group name, so only a COLD group pays a
  # compile/install), but the ceilings are what a job timeout must respect: if a
  # slow-but-healthy run ever approaches the outer GitHub Actions job timeout,
  # the JOB dies before any per-case timeout or named assertion can fire, and CI
  # reports an ambiguous kill instead of a named failure — exactly the failure
  # mode the per-case timeouts were added to prevent, recreated one layer up by
  # an outer number that is too tight. Splitting by variant also caps peak disk
  # at one multi-GB image per RUNNER (each job builds only its own), which is
  # the same constraint that drove run.sh's serial build-then-rmi design in the
  # first place, and lets the two halves run in parallel instead of stacking
  # their wall-clock into one job.
  packages-agents:
    name: Package installs — agents variant (real allowlist)
    runs-on: ubuntu-latest
    # Real headroom over the realistic 15-30 min estimate, but comfortably below
    # the 700+710+720 worst-case sum (2100+2400+2000s = 108 min). That gap is
    # deliberate: a job that runs long past 60 min is a signal worth catching
    # (something is genuinely slow, or hanging in a way no per-case timeout
    # caught), while a job killed at or near the WORST-CASE ceiling reports
    # nothing about anything — no named failure, no diagnostics, just "the job
    # died" — which is precisely the ambiguous-timeout failure this split
    # exists to avoid recreating one layer up.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Disk headroom before anything builds. Each job now builds exactly ONE
      # variant image on its own runner (the per-variant split above), so the
      # peak here is one multi-GB image — but a runner that starts near full
      # still fails that build with an error that looks nothing like "out of
      # space".
      - name: Free disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h / | tail -1

      # Wall-clock timer, plus a background disk-usage sampler — both started
      # right before the tier step, not measured after it. run.sh's own
      # sweep() EXIT trap and its per-variant `docker rmi` both run INSIDE the
      # "Packages tier" step below, before that step returns, so anything a
      # LATER step reads with `df`/`docker system df` only ever sees what is
      # left AFTER that cleanup — a post-cleanup floor, never the multi-GB
      # high-water mark while the image was still on disk. The sampler polls
      # BOTH used and available on / every 5s into a log for as long as the
      # tier step runs; it is cheap (one `df` + a 5s sleep) and self-limiting
      # (the log holds a handful of KB even over a 90-minute job). Available is
      # sampled alongside used because used ALONE is not comparable to any
      # threshold — a GitHub runner boots with tens of GB already occupied, so
      # peak-used mostly measures the runner image, not this tier.
      - name: Start timer and disk-peak sampler
        run: |
          echo "PACKAGES_START=$(date +%s)" >> "$GITHUB_ENV"
          rm -f /tmp/disk-samples.log
          ( while :; do df --output=used,avail -BM / | awk 'NR==2 { gsub(/M/,""); print $1, $2 }' >> /tmp/disk-samples.log; sleep 5; done ) &
          echo "DISK_SAMPLER_PID=$!" >> "$GITHUB_ENV"

      # --require packages: a selected case whose requirement is unmet FAILS the
      # job rather than skipping quietly. A case that cannot run is never a
      # pass. --variant agents narrows run.sh's own --tags packages selection to
      # this job's three agents-variant cases (700/710/720); the native
      # variant's four cases run in the sibling job below.
      - name: Packages tier (agents variant)
        run: >-
          ./tests/integration/run.sh --tags packages --variant agents --require packages
          ${{ inputs.cases && format('--cases {0}', inputs.cases) || '' }}

      # The two numbers that decide whether this half of the tier stays this
      # shape. Recorded every night: an unmeasured budget is how a tier
      # silently outgrows its runner. `if: always()` so a failing tier step
      # still gets measured — the sampler must survive that and this step must
      # never fail ON TOP of a failing tier, so killing it is best-effort.
      - name: Budget
        if: always()
        run: |
          if [ -n "${DISK_SAMPLER_PID:-}" ]; then
            kill "$DISK_SAMPLER_PID" 2>/dev/null || true
          fi
          end=$(date +%s)
          start="${PACKAGES_START:-$end}"
          elapsed=$((end - start))
          echo "packages-agents wall-clock: $((elapsed / 60))m $((elapsed % 60))s"
          # Sampled every 5s WHILE THE TIER STEP RAN. Four figures, not one,
          # because peak-used ALONE is not comparable to any threshold: a
          # GitHub runner boots with tens of GB already occupied, so a peak of
          # ~48000M says almost nothing about what this tier cost.
          #   baseline / peak — absolute, for the record
          #   +delta          — what THIS tier actually consumed
          #   min available   — the headroom that predicts an out-of-space build
          # The COST SWITCH comment states its threshold against MIN AVAILABLE,
          # the one figure here that is directly comparable to a limit.
          if [ -s /tmp/disk-samples.log ]; then
            base="$(head -1 /tmp/disk-samples.log | awk '{print $1}')"
            peak="$(awk '{print $1}' /tmp/disk-samples.log | sort -n | tail -1)"
            mina="$(awk '{print $2}' /tmp/disk-samples.log | sort -n | head -1)"
            echo "packages-agents disk on /: baseline used ${base}M, peak used ${peak}M, this tier +$((peak - base))M, MIN AVAILABLE ${mina}M"
          else
            echo "packages-agents disk on /: NO SAMPLES (sampler did not run)"
          fi
          # For comparison only — this is the POST-CLEANUP snapshot, not the
          # peak; run.sh's sweep()/rmi have already reclaimed the image by now.
          echo "-- post-cleanup snapshot --"
          df -h / | tail -1
          docker system df

  packages-native:
    name: Package installs — native variant (real allowlist)
    runs-on: ubuntu-latest
    # Real headroom over the realistic 25-50 min estimate, but comfortably below
    # the 730+740+750+760 worst-case sum (3900+3900+3900+7600s = 322 min). Same
    # trade as the agents job above: a long-but-alive job is a signal, a job
    # killed at the outer timeout is silence.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Free disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h / | tail -1

      # See the identical step in packages-agents above for why the sampler
      # exists: run.sh's own cleanup runs INSIDE the tier step, so a df taken
      # afterward is a post-cleanup floor, not the peak.
      - name: Start timer and disk-peak sampler
        run: |
          echo "PACKAGES_START=$(date +%s)" >> "$GITHUB_ENV"
          rm -f /tmp/disk-samples.log
          ( while :; do df --output=used,avail -BM / | awk 'NR==2 { gsub(/M/,""); print $1, $2 }' >> /tmp/disk-samples.log; sleep 5; done ) &
          echo "DISK_SAMPLER_PID=$!" >> "$GITHUB_ENV"

      # COST SWITCH. IT_RUBY_VERSIONS (tests/integration/run.sh) defaults to
      # 3.3.6,3.4.5, and the native variant compiles BOTH at container start —
      # every one of 740/750/760 pays for this; 760's own 7600s budget is the
      # two-version cold-compile precedent (case 730) applied twice. If this job
      # routinely runs past ~75 minutes, or the Budget step below reports MIN
      # AVAILABLE on / during the tier below ~10000M, the lever is to set, on
      # this job:
      #   env:
      #     IT_RUBY_VERSIONS: "3.4.5"
      # and add `--exclude needs-multiruby` to the step below.
      #
      # The threshold names MIN AVAILABLE deliberately, and that is the figure
      # the Budget step prints under that exact name. An earlier revision stated
      # it as "peak disk used above ~11 GB" while the instrument reported TOTAL
      # used on / — measured at 46784M (native) and 49180M (agents), dominated
      # by what the runner image already occupies. So the threshold was
      # permanently exceeded and meant nothing. A limit expressed in units its
      # instrument does not report is a limit nobody can act on; if either side
      # changes, change both.
      #
      # If that switch is ever thrown: 750-ruby-multiversion-selection has
      # nothing left to select between (run.sh's probe_multiruby requires a
      # comma in IT_RUBY_VERSIONS to report the `multiruby` capability at all),
      # so it becomes a LOCAL-ONLY case — exercised by verify-on-host.sh on a
      # workstation and by NOTHING in CI. That is a real coverage gap, not a
      # hypothetical one, and this comment is where it must be recorded: a
      # trade-off written only in a design doc is a trade-off nobody will find.
      - name: Packages tier (native variant)
        run: >-
          ./tests/integration/run.sh --tags packages --variant native --require packages
          ${{ inputs.cases && format('--cases {0}', inputs.cases) || '' }}

      - name: Budget
        if: always()
        run: |
          if [ -n "${DISK_SAMPLER_PID:-}" ]; then
            kill "$DISK_SAMPLER_PID" 2>/dev/null || true
          fi
          end=$(date +%s)
          start="${PACKAGES_START:-$end}"
          elapsed=$((end - start))
          echo "packages-native wall-clock: $((elapsed / 60))m $((elapsed % 60))s"
          # Sampled every 5s WHILE THE TIER STEP RAN. Four figures, not one,
          # because peak-used ALONE is not comparable to any threshold: a
          # GitHub runner boots with tens of GB already occupied, so a peak of
          # ~48000M says almost nothing about what this tier cost.
          #   baseline / peak — absolute, for the record
          #   +delta          — what THIS tier actually consumed
          #   min available   — the headroom that predicts an out-of-space build
          # The COST SWITCH comment states its threshold against MIN AVAILABLE,
          # the one figure here that is directly comparable to a limit.
          if [ -s /tmp/disk-samples.log ]; then
            base="$(head -1 /tmp/disk-samples.log | awk '{print $1}')"
            peak="$(awk '{print $1}' /tmp/disk-samples.log | sort -n | tail -1)"
            mina="$(awk '{print $2}' /tmp/disk-samples.log | sort -n | head -1)"
            echo "packages-native disk on /: baseline used ${base}M, peak used ${peak}M, this tier +$((peak - base))M, MIN AVAILABLE ${mina}M"
          else
            echo "packages-native disk on /: NO SAMPLES (sampler did not run)"
          fi
          # For comparison only — this is the POST-CLEANUP snapshot, not the
          # peak; run.sh's sweep()/rmi have already reclaimed the image by now.
          echo "-- post-cleanup snapshot --"
          df -h / | tail -1
          docker system df
