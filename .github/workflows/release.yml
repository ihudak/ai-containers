name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth: 0 is NECESSARY but NOT SUFFICIENT, and both halves were
          # learned from a failed release rather than from the documentation.
          #
          # The title comes from the ANNOTATED TAG'S MESSAGE, so this job needs
          # the tag OBJECT. `fetch-tags: true` was the first attempt and fails
          # outright on a tag push: it drops checkout's `--no-tags`, so git's
          # automatic tag-following collides with checkout's own explicit
          # `+<sha>:refs/tags/<tag>` refspec and git refuses two sources for one
          # destination. Merely dropping it is worse than it looks -- the fetch
          # then succeeds and leaves refs/tags/<tag> on a COMMIT, so the title
          # silently degrades to the bare tag name.
          fetch-depth: 0

      # RESTORE THE TAG OBJECT. checkout fetches real tags and then, on a tag
      # push, force-updates refs/tags/<tag> to the commit SHA -- two fetches, the
      # second undoing what the first brought. Observed in the runner log for
      # v0.8.0's second attempt:
      #
      #   git fetch ... +refs/heads/*:... +refs/tags/*:refs/tags/*   <- tag object
      #   git fetch --no-tags ... +<sha>:refs/tags/v0.8.0            <- clobbers it
      #
      # So `cat-file -t` reported `commit`, release-title.sh correctly read a
      # lightweight tag, and the release published as a bare "v0.8.0" with a
      # perfectly good body. No amount of checkout configuration prevents that
      # second fetch; the tag object has to be put back afterwards.
      - name: Restore the annotated tag object
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          kind="$(git cat-file -t "$GITHUB_REF_NAME")"
          printf 'tag object type: %s\n' "$kind"
          # Fail here rather than publishing a bare-titled release: a wrong title
          # on a published release is far more annoying to correct than a failed
          # workflow, and this is the one place that can still tell the
          # difference.
          [ "$kind" = "tag" ] || { echo "::error::refs/tags/${GITHUB_REF_NAME} is a ${kind}, not an annotated tag object — the title would degrade to the bare tag name"; exit 1; }

      # The notes are the CHANGELOG's own section for this tag — the text a human
      # wrote and a reviewer read — not GitHub's generated list of merged pull
      # requests. `generate_release_notes: true` named every branch that landed
      # and explained none of them, and RACED with anyone who also ran `gh
      # release create`: both write the same body and neither waits. v0.5.0's
      # release still carries the generated block twice.
      #
      # THE TAG PUSH IS THE ONLY AUTHOR. Do not also run `gh release create` —
      # push the tag and let this publish. A tag whose version has no CHANGELOG
      # section fails at this step, before anything is published. (docs/
      # contributing.md carries the same rule; it is repeated here because this
      # is where somebody adding a step would be standing.)
      - name: Extract release notes from CHANGELOG
        run: bash ./changelog-section.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      # The TITLE, from the same tag that supplies the notes. Passing no `name`
      # to the action leaves it defaulting to the tag string, so every release
      # published so far was titled "v0.6.0", "v0.7.0", and every descriptive
      # title in this repo's history was typed in by hand afterwards — a manual
      # step invisible until someone notices a bare title, and therefore one
      # that will be forgotten.
      #
      # The description already exists in the right place: the annotated tag's
      # own message, written at the moment of tagging. This makes the tag the
      # single author of BOTH the body and the title, which is the principle
      # changelog-section.sh already established for the body.
      #
      # In a script rather than three lines here, because a `run:` block can be
      # read but not executed by anything in the hermetic suite —
      # tests/test-release-title.sh drives release-title.sh against real
      # annotated, lightweight, empty-message and absent tags.
      - name: Derive the release title from the tag
        id: title
        run: |
          set -euo pipefail
          title="$(bash ./release-title.sh "$GITHUB_REF_NAME")"
          printf 'value=%s\n' "$title" >> "$GITHUB_OUTPUT"
          printf 'release title: %s\n' "$title"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9  # v3.0.1
        with:
          name: ${{ steps.title.outputs.value }}
          body_path: ${{ runner.temp }}/notes.md
