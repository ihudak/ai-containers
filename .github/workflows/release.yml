name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth: 0, NOT fetch-tags: true, and the difference is the whole
          # reason v0.8.0's first release attempt failed at checkout.
          #
          # The title comes from the ANNOTATED TAG'S MESSAGE, so this job needs
          # the tag OBJECT, not merely a ref of that name. `fetch-tags: true`
          # was the obvious way to ask for that and is actively wrong here: it
          # drops checkout's `--no-tags`, so git's automatic tag-following wants
          # to write refs/tags/<tag> at the same time as checkout's own explicit
          # `+<sha>:refs/tags/<tag>` refspec, and git refuses two sources for one
          # destination:
          #
          #   fatal: Cannot fetch both <sha> and refs/tags/v0.8.0 to refs/tags/v0.8.0
          #
          # Simply removing fetch-tags is not the fix either — measured, not
          # assumed. That restores `--no-tags`, the fetch succeeds, and
          # refs/tags/<tag> then points at a COMMIT: `git cat-file -t` reports
          # `commit`, release-title.sh correctly reads that as a lightweight tag
          # and falls back to the bare tag name. That is precisely the defect
          # de3c706 set out to fix, reintroduced by the repair.
          #
          # fetch-depth: 0 fetches full history and real tag objects, with no
          # SHA-to-tag refspec to collide with. Verified against this repository:
          # `cat-file -t v0.8.0` -> `tag`, and release-title.sh renders the
          # message. tests/test-release-checkout.sh pins it by EFFECT — it reads
          # this block and proves the configuration it describes actually yields
          # a usable annotated tag.
          fetch-depth: 0
      - name: Extract release notes from CHANGELOG
        run: bash ./changelog-section.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      # The TITLE, from the same tag that supplies the notes. Passing no `name`
      # to the action leaves it defaulting to the tag string, so every release
      # published so far was titled "v0.6.0", "v0.7.0", and every descriptive
      # title in this repo's history was typed in by hand afterwards — a manual
      # step invisible until someone notices a bare title, and therefore one
      # that will be forgotten.
      #
      # The description already exists in the right place: the annotated tag's
      # own message, written at the moment of tagging. This makes the tag the
      # single author of BOTH the body and the title, which is the principle
      # changelog-section.sh already established for the body.
      #
      # In a script rather than three lines here, because a `run:` block can be
      # read but not executed by anything in the hermetic suite —
      # tests/test-release-title.sh drives release-title.sh against real
      # annotated, lightweight, empty-message and absent tags.
      - name: Derive the release title from the tag
        id: title
        run: |
          set -euo pipefail
          title="$(bash ./release-title.sh "$GITHUB_REF_NAME")"
          printf 'value=%s\n' "$title" >> "$GITHUB_OUTPUT"
          printf 'release title: %s\n' "$title"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9  # v3.0.1
        with:
          name: ${{ steps.title.outputs.value }}
          body_path: ${{ runner.temp }}/notes.md
