name: Update nvm version

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  update-nvm:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - name: Get latest nvm release tag
        id: latest
        run: |
          tag=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/nvm-sh/nvm/releases/latest \
            | jq -r '.tag_name')
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "::error::Failed to fetch latest nvm release tag from GitHub API"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Read current nvm version
        id: current
        run: |
          # THE DOCKERFILE ARG IS THE ONLY THING THIS JOB MAINTAINS. sandbox.conf's
          # nvm-version ships EMPTY, which means "use this ARG", so keeping the ARG
          # current is what makes every project track the maintained version.
          # Writing a pin into sandbox.conf would be actively harmful: sync-to-projects.sh
          # never overwrites a key a project already set, so the pin would reach new
          # projects and then freeze there forever while the ARG moved on.
          dockerfile=$(grep '^ARG NVM_VERSION=' Dockerfile | cut -d= -f2-)
          if [[ -z "$dockerfile" ]]; then
            echo "::error::could not read ARG NVM_VERSION from Dockerfile"
            exit 1
          fi
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"

      - name: Update files if version changed
        id: update
        run: |
          latest="${{ steps.latest.outputs.tag }}"
          dockerfile="${{ steps.current.outputs.dockerfile }}"

          if [[ "$latest" == "$dockerfile" ]]; then
            echo "already up to date ($latest)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The Dockerfile ARG, and nothing else. See the note in the step above.
          sed -i "s/^ARG NVM_VERSION=.*/ARG NVM_VERSION=${latest}/" Dockerfile

          # Assert the edit landed, rather than trusting sed's exit status — sed
          # succeeds when its pattern matches nothing, which would open a PR that
          # claims an update and carries none.
          if ! grep -qx "ARG NVM_VERSION=${latest}" Dockerfile; then
            echo "::error::the ARG NVM_VERSION edit did not land"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "previous=${dockerfile}" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/nvm-${{ steps.latest.outputs.tag }}
          commit-message: "chore: update nvm to ${{ steps.latest.outputs.tag }}"
          title: "chore: update nvm to ${{ steps.latest.outputs.tag }}"
          body: |
            Automated update of nvm from `${{ steps.update.outputs.previous }}` to `${{ steps.latest.outputs.tag }}`.

            **Changed files:**
            - `Dockerfile` — `ARG NVM_VERSION` default updated

            `sandbox.conf`'s `nvm-version` is deliberately left empty and is not
            touched by this job: empty means "use the ARG above", so every project
            that has not pinned one tracks this update automatically.

            Release notes: https://github.com/nvm-sh/nvm/releases/tag/${{ steps.latest.outputs.tag }}
          labels: dependencies
          delete-branch: true
