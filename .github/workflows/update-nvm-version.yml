name: Update nvm version

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  update-nvm:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - name: Get latest nvm release tag
        id: latest
        run: |
          tag=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/nvm-sh/nvm/releases/latest \
            | jq -r '.tag_name')
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "::error::Failed to fetch latest nvm release tag from GitHub API"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Read current nvm version
        id: current
        run: |
          # THE DOCKERFILE IS THE ONLY PLACE THIS LIVES NOW. sandbox.conf's
          # nvm-version= is empty by default and means "use the Dockerfile's
          # ARG", so there is nothing here to update -- and updating it would be
          # actively wrong: sync-to-projects.sh never overwrites a key a project
          # already has, so a pinned value in the shipped conf reached no
          # existing project while making every new one carry its own frozen
          # copy. A project that wants a pin sets one deliberately.
          dockerfile=$(grep '^ARG NVM_VERSION=' Dockerfile | cut -d= -f2-)
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"

      - name: Update files if version changed
        id: update
        run: |
          latest="${{ steps.latest.outputs.tag }}"
          dockerfile="${{ steps.current.outputs.dockerfile }}"

          if [[ "$latest" == "$dockerfile" ]]; then
            echo "already up to date ($latest)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Update Dockerfile ARG default -- the single source of the version.
          sed -i "s/^ARG NVM_VERSION=.*/ARG NVM_VERSION=${latest}/" Dockerfile

          # The edit must have LANDED. `sed -i` reports success when its pattern
          # matched nothing, so a renamed ARG would open a PR changing no file
          # and report the version as updated.
          if ! grep -q "^ARG NVM_VERSION=${latest}$" Dockerfile; then
            echo "ERROR: ARG NVM_VERSION= is not ${latest} after the edit -- the pattern matched nothing" >&2
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "previous=${dockerfile}" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/nvm-${{ steps.latest.outputs.tag }}
          commit-message: "chore: update nvm to ${{ steps.latest.outputs.tag }}"
          title: "chore: update nvm to ${{ steps.latest.outputs.tag }}"
          body: |
            Automated update of nvm from `${{ steps.update.outputs.previous }}` to `${{ steps.latest.outputs.tag }}`.

            **Changed files:**
            - `sandbox.conf` — `nvm-version` updated
            - `Dockerfile` — `ARG NVM_VERSION` default updated

            Release notes: https://github.com/nvm-sh/nvm/releases/tag/${{ steps.latest.outputs.tag }}
          labels: dependencies
          delete-branch: true
