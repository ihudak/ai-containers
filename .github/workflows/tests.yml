name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: Shell test suite
    runs-on: ubuntu-latest

    steps:
      # Full history: check-sandbox-version.sh compares sandbox.conf against a
      # base ref, so a shallow clone would leave it nothing to diff.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Show bash version
        run: bash --version | head -1

      # The suite drives project-init.sh / sync-to-projects.sh, which rsync the
      # repo into throwaway dirs. Present on GitHub runners, guarded anyway.
      - name: Ensure rsync is available
        run: command -v rsync >/dev/null || (sudo apt-get update && sudo apt-get install -y rsync)

      - name: Run tests
        run: ./tests/run-all.sh

      # The documented CI gate against a SILENT semantic sandbox.conf change.
      # BASE_REF must predate the change under review: the script's default HEAD
      # only detects an UNCOMMITTED edit and silently no-ops in CI.
      - name: sandbox.conf schema gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # The whole push, not just its last commit: HEAD^ would diff only the
            # newest commit and miss a key removed earlier in the same push.
            # event.before is all-zeros for a new branch and stale after a force
            # push, so fall back to HEAD^ when it is not a reachable commit.
            base="${{ github.event.before }}"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="HEAD^"
            fi
          fi
          echo "diffing sandbox.conf against $base"
          BASE_REF="$base" ./check-sandbox-version.sh --check
