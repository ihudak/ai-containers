name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: Shell test suite
    runs-on: ubuntu-latest

    steps:
      # Full history: check-sandbox-version.sh compares sandbox.conf against a
      # base ref, so a shallow clone would leave it nothing to diff.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Show bash version
        run: bash --version | head -1

      # The suite drives project-init.sh / sync-to-projects.sh, which rsync the
      # repo into throwaway dirs. Present on GitHub runners, guarded anyway.
      - name: Ensure rsync is available
        run: command -v rsync >/dev/null || (sudo apt-get update && sudo apt-get install -y rsync)

      - name: Run tests
        run: ./tests/run-all.sh

      # The documented CI gate against a SILENT semantic sandbox.conf change.
      # BASE_REF must predate the change under review: the script's default HEAD
      # only detects an UNCOMMITTED edit and silently no-ops in CI.
      - name: sandbox.conf schema gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # The whole push, not just its last commit: HEAD^ would diff only the
            # newest commit and miss a key removed earlier in the same push.
            # event.before is all-zeros for a new branch and stale after a force
            # push, so fall back to HEAD^ when it is not a reachable commit.
            base="${{ github.event.before }}"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="HEAD^"
            fi
          fi
          echo "diffing sandbox.conf against $base"
          BASE_REF="$base" ./check-sandbox-version.sh --check

  suite-floor:
    name: Shell test suite (bash floor)
    runs-on: ubuntu-latest
    # ubuntu:22.04 ships bash 5.1.16 — the declared floor — with GNU coreutils.
    # `suite` above runs on whatever bash ubuntu-latest happens to ship, which
    # drifts upward with the runner image; this job pins the CLAIM. Raising the
    # floor means changing this image and bash-floor.sh together.
    container: ubuntu:22.04

    steps:
      # BEFORE checkout: actions/checkout needs git inside the container, and
      # without it silently falls back to a REST download with no .git — which
      # tests/test-mutations.sh detects and fails on (it needs a git work tree
      # for `git apply --check`). rsync is needed by the project-init tests.
      - name: Install git and rsync
        run: apt-get update -qq && apt-get install -y -qq git rsync ca-certificates

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Show bash version
        run: bash --version | head -1

      - name: Run tests at the declared floor
        run: ./tests/run-all.sh

  lint:
    name: Shell lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Parse every script, including the integration harness and its cases. A
      # syntax error in a case would otherwise surface minutes into a container
      # run as a mysterious runtime failure, after paying for an image build.
      - name: bash -n over every script
        run: |
          rc=0
          n=0
          while IFS= read -r f; do
            n=$((n + 1))
            bash -n "$f" || { echo "PARSE ERROR: $f"; rc=1; }
          done < <(git ls-files '*.sh')
          # A lint job that parsed nothing must not report success: a changed
          # pathspec or a repo reorganisation would silently turn this into a
          # no-op that still goes green.
          if [ "$n" -eq 0 ]; then
            echo "::error::git ls-files '*.sh' matched no files — nothing was parsed"
            exit 1
          fi
          echo "parsed $n script(s)"
          exit $rc

      # The floor is 5.1 while CI runs 5.2 and a developer's Mac runs 5.3.
      # Nothing else compares them, so this is the only thing standing between
      # a comfortable ${ cmd; } on the host and a container that will not start.
      - name: bash dialect (nothing newer than the declared floor)
        run: ./tests/bash-dialect-lint.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # -e SC1091: sourced paths are resolved at runtime, not by the linter.
          # GATE: increment 4 cleared the pre-existing findings backlog (fixed
          # the real defects, suppressed the rest at the site with a reason —
          # see git history for "clear the shellcheck backlog and gate on it")
          # and promoted this from advisory to blocking. verify-on-host.sh
          # Phase 7 runs this identical command locally.
          git ls-files '*.sh' | xargs shellcheck -S warning -e SC1091
