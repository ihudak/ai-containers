# sandbox.conf — optional component configuration for the AI sandbox container.
#
# Boolean components: set to ON to include, OFF (or comment out) to exclude.
# Version-list components: set to a comma-separated list of versions to install,
#   or leave empty (key=) to skip. The latest version is always installed
#   for components that are required by AI agents (node, python).
#   An explicit key=OFF is also accepted and means the same as empty (skip).
#
# Run ./build.sh after changing this file.

# schema-version: 4
# Bumped ONLY when a migrations/ hook is added (a rename/split/removal).
# Plain new keys need no bump. See README "sandbox.conf schema versioning".

# ── AI agents ──────────────────────────────────────────────────────────────────
copilot=ON
kiro=OFF
claude-code=ON
codex=OFF
gemini=OFF
graphify=OFF

# ── Java / JVM (via SDKMAN) ────────────────────────────────────────────────────
# SDKMAN is auto-installed when any JVM component has at least one version listed.
# Specify comma-separated version numbers. Leave empty (e.g. openjdk=) to skip.
#
# IMPORTANT: Version numbers must match SDKMAN's distribution identifiers.
# SDKMAN uses full patch versions (e.g. 21.0.5, 25.0.2), not just major versions.
# Run `sdk list java` inside a container to see available identifiers.
# Examples:
#   openjdk=21.0.11         → installs 21.0.11-tem (Adoptium Temurin)
#   graalvm-ce=25.0.2       → installs 25.0.2-graalce
#   graalvm-oracle=25.0.3   → installs 25.0.3-graal
#
# graalvm-ce    = GraalVM Community Edition (free, open-source). SDKMAN id: <ver>-graalce
# graalvm-oracle = GraalVM Oracle (free for production since 2023). SDKMAN id: <ver>-graal
# Both graalvm variants also install the native-image toolchain.
# maven/gradle/kotlin/scala: specify a version (e.g. maven=3.9.9) or leave empty.
#
# NOTE: SDKMAN itself is always installed at the latest version (get.sdkman.io
# does not support version pinning). Use --no-cache to pick up SDKMAN updates.
openjdk=
graalvm-ce=
graalvm-oracle=
kotlin=
scala=
maven=
gradle=

# ── Node.js (via nvm) ──────────────────────────────────────────────────────────
# The latest LTS is ALWAYS installed (required by AI agents like Copilot, Claude Code).
# List additional versions to install alongside it (comma-separated).
# Example: node=20,22  installs Node 20 and 22 in addition to the always-on latest LTS.
node=

# nvm version — pin the nvm release used to install Node.js.
# Check https://github.com/nvm-sh/nvm/releases for newer versions.
# Leave empty to use the Dockerfile default.
nvm-version=v0.40.6

# ── Python (via pyenv) ─────────────────────────────────────────────────────────
# The latest stable Python is ALWAYS installed.
# List additional versions to install alongside it (comma-separated).
# Example: python=3.12,3.11
#
# NOTE: pyenv itself is always installed at the latest version (pyenv.run does
# not support version pinning). Use --no-cache to pick up pyenv updates.
python=

# ── Ruby (via rvm) ────────────────────────────────────────────────────────────
# Specify a comma-separated list of Ruby versions to install.
# rvm is auto-installed when ruby has a version set.
# Ruby versions and gems persist in the group-mounted ~/.rvm directory across
# container runs. A version's first install compiles at container start.
# Example: ruby=3.4.5,3.3.0  installs both versions; gems persist in ~/.rvm.
# Leave empty to skip.
ruby=

# ── Rust (via rustup) ──────────────────────────────────────────────────────────
# Accepted values: stable, beta, nightly, or a specific version (e.g. 1.87.0).
# Leave empty to skip.
rust=

# ── Go ─────────────────────────────────────────────────────────────────────────
# Specify a version (e.g. go=1.24.2) or leave empty to skip.
# Uses the official go.dev/dl tarball — no version manager needed.
go=

# ── Cloud / infra ──────────────────────────────────────────────────────────────
github-cli=ON
kubectl=OFF
aws-cli=OFF
azure-cli=OFF

# ── Dynatrace ──────────────────────────────────────────────────────────────────
# ON    = auto-detect and install the latest release (requires GitHub API access).
#         If the API is rate-limited, set GITHUB_TOKEN on your host before building,
#         or pin a specific version instead.
# x.y.z = install that exact version — no GitHub API call, fully reproducible.
# OFF   = skip entirely.
#
# NOTE: For dtctl/dtmgd to work in restricted mode, your Dynatrace tenant URL
# must be allowlisted. Add it to allowlist-domains.d/dynatrace.txt (or custom.txt)
# and rebuild. See the dynatrace.txt fragment for details.
dtctl=OFF
dtmgd=OFF

# acli: the official Atlassian CLI (Jira, Confluence, admin, assets, ...).
# GRAMMAR DIFFERS from the other tools: ON | OFF only, no version pinning.
# Atlassian publishes every package behind a "latest" URL (a versioned path
# returns 403) and supports each release for 6 months, so `ON` means whatever is
# current at build time — check with `acli --version`. acli is baked into the
# image at build time (unlike the runtime-installed agent-tier tools), so
# refreshing it means rebuilding: `./build.sh --no-cache` (there is no pinned
# version to bump instead).
# No GITHUB_TOKEN involved: the download is vendor-hosted, not a GitHub release.
# Authenticate ONCE PER CONTAINER GROUP (state is group-scoped in
# ~/.config/acli, and the binary needs no OS keyring):
#   echo "$TOKEN" | acli jira auth login --email you@example.com \
#       --site your-org.atlassian.net --token
# Endpoints are allowlisted via allowlist-domains.d/atlassian.txt.
acli=OFF

# ── Dev tools ──────────────────────────────────────────────────────────────────
# angular-cli: ON = latest, version number = pinned (e.g. 19), OFF = skip.
# SINGLE VERSION ONLY.
# Angular CLI is included because AI coding agents frequently scaffold and
# modify Angular projects. It is not an AI agent itself.
# NOTE: Angular CLI adds ~300–500 MB to the image. Set to OFF if not needed.
angular-cli=OFF
yarn=OFF
bun=ON

# ── Database clients (language-agnostic) ────────────────────────────────────────
# Comma-separated subset of {pg, mysql, mongo}. Installs CLIENT/dev libraries and
# shells ONLY — never database servers. Serves native DB drivers in any language
# (Ruby pg/mysql2, Python psycopg2/mysqlclient, Node pg-native) and gives agents a
# DB shell (psql / mysql / mongosh). Empty = skip.
#   pg    → libpq-dev + postgresql-client (psql)
#   mysql → default-libmysqlclient-dev + default-mysql-client
#   mongo → mongosh (from MongoDB's apt repo; adds repo.mongodb.org to allowlist)
# Enabling this (or ruby=) also retains a runtime build toolchain so native
# extensions compile at runtime.
db-clients=

# c-toolchain: ON keeps a C compiler and headers (build-essential, libyaml-dev,
# zlib1g-dev, libssl-dev) in the finished image. Needed by anything that
# compiles C INSIDE the container — cgo (`go test -race`), or a gem/wheel/npm
# package with a native extension built at install time. Implied already when
# `ruby` or `db-clients` is set, so this key is for projects that need a
# compiler without either of those. See docs/components/c-toolchain.md.
c-toolchain=OFF

# ── Image + PDF tooling ─────────────────────────────────────────────────────────
# imagemagick: ON installs ImageMagick (mini_magick / image_processing / carrierwave).
imagemagick=OFF
# wkhtmltopdf: ON installs the wkhtmltopdf runtime libraries (so a gem-vendored
# binary runs) plus the official standalone binary. Off by default.
wkhtmltopdf=OFF

# pnpm: fast, disk-efficient Node package manager (https://pnpm.io). ON installs
# the latest pnpm globally via npm at build time (corepack ships with Node, but a
# non-root sandbox user can't enable it at runtime — the nvm dir is root-owned).
pnpm=OFF

# goreleaser: release automation for Go (and other) projects. ON installs the
# latest GoReleaser OSS from the official apt repository. Does not require Go to
# be enabled — the binary is self-contained. Set to OFF to skip.
goreleaser=OFF

# vale: prose/style linter for docs (https://vale.sh). ON installs the latest
# Vale binary from GitHub releases (vale-cli/vale) — a single self-contained Go
# binary, no extra deps. NOT baked into the image: like the other agent-tier
# tools it installs at CONTAINER START into the group-mounted ~/.ai-tools
# (agent-tools-reconcile.sh), so `--no-cache` does not refresh it and it
# self-updates in place. Handy in docs workspaces whose style-check phase
# otherwise warns that "Vale isn't installed". Set OFF to skip.
vale=OFF

# qmd: on-device markdown search engine (https://github.com/tobi/qmd).
# Set to ON when you plan to use VAULT_PATH (an Obsidian vault or any markdown
# corpus, mounted at /workspace/vault) or
# any markdown notes/docs collection inside the container. ON installs
# @tobilu/qmd globally via npm at build time.
qmd=OFF
