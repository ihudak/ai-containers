# ── EXCLUDED: deliberately not classified ─────────────────────────────────────
# An exclusion needs a reason and the reason is CHECKED: an #EXCLUDED| row with
# an empty reason suppresses nothing, and its target reverts to unmapped — the
# same idiom as this repo's `# dialect-lint: allow RULE-ID: reason`.
#EXCLUDED|tests/run-all.sh|the suite driver every oracle runs under: mutating it would corrupt the measuring instrument rather than measure anything, and tests/falsify/run.sh invokes it per mutant, so a mutated driver would also be the thing reporting the result. It IS executed (tests/test-falsify-targets.sh runs it to pin the exit-2-on-no-match premise), which is exactly why it needs an exclusion rather than a GREPPED-ONLY row
#EXCLUDED|capture-on-host.sh|a HOST INVESTIGATION LAUNCHER, run by a human on the machine where a fault reproduces, and no hermetic oracle drives it — mutating it would yield survivors that measure the absence of a harness rather than the quality of one, which is the failure mode this map exists to keep out. It arms the scaffolding capture and samples machine state around a real corpus run (backlog F31/F32); the tier it wraps is already measured by every other row here. Give it a real row the day something executes it.
