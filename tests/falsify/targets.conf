# tests/falsify/targets.conf — which file the mutation tier may mutate, and
# which hermetic test is the ORACLE that must kill its mutants.
#
# A mutant only measures assertion quality if the suite EXECUTES the mutated
# code. A test that merely greps a file's text kills nothing: every mutant
# survives, and the tier would report that survival as an assertion gap when it
# is really a classification error in this file. So this map is DERIVED, then
# CHECKED: tests/falsify/derive-targets.sh resolves what the hermetic tests
# source and run (through path variables, through symlinks and copies, and
# transitively through what an executed file itself executes) and
# tests/test-falsify-targets.sh fails if this file and that derivation disagree
# — in EITHER direction. Run `bash tests/falsify/derive-targets.sh --evidence`
# to see the file:line each verdict rests on.
#
# ── ROW GRAMMAR ───────────────────────────────────────────────────────────────
#
#   ACTIVE     <target>|<category>|<oracle-test>[|<functions>]
#   DEFERRED   #DEFERRED|<target>|<category>|<oracle-test>|<functions|->|<reason>
#   EXCLUDED   #EXCLUDED|<target>|<reason>
#
#   target      repo-relative path of a tracked *.sh
#   category    EXECUTED-WHOLE    mutation unit = the whole file
#               EXECUTED-PARTIAL  mutation unit = the NAMED functions (4th field)
#               GREPPED-ONLY      never mutated
#   oracle      one or more tests/test-*.sh basenames, comma-separated, no
#               spaces. Each must be selected UNIQUELY by `run-all.sh <name>`,
#               and on an EXECUTED-* row each must be a test the derivation
#               observes EXECUTING this target — a real test that never runs
#               the file kills nothing, so every mutant survives and the ledger
#               fills with debt for coverage the row never had.
#               `-` only on a GREPPED-ONLY row, and only when no hermetic test
#               asserts anything about the file at all.
#   functions   comma-separated, no spaces; required for EXECUTED-PARTIAL and
#               refused for the other two categories. Every name must be
#               defined in the target file — checked, not trusted.
#
# ── WHY THE ORACLE IS A SET AND NOT ONE NAME ──────────────────────────────────
# Several names are ONE invocation — `run-all.sh -v a.sh b.sh` OR-combines its
# filters and reports one aggregate status — so a FAIL: from any member is that
# target's kill, and the baseline requires every member green.
#
# The field started out as a single name, and that was a defect with a measured
# cost: a target's code can be driven by more tests than the one dedicated to
# it, and eight real kills of tests/lib-verify-repo.sh were being recorded as
# SURVIVORS because the three mk_repo knobs they damage are driven by
# test-verify-exit-code.sh and test-layer-containment.sh — never by
# test-lib-verify-repo.sh. That is targets.conf's own documented failure mode
# arriving from the opposite direction: not a target whose code the oracle never
# executes, but a target whose code several tests drive while the row allowed
# one name. The ledger then owed entries for assertions that already existed.
#
# AN EXTRA ORACLE IS NOT FREE AND NOT AUTOMATICALLY RIGHT. It costs its own
# runtime on every mutant of that target, so name a test here only when it is
# measured to kill something the others do not — and measure that at --jobs 1.
# tests/portability.sh is the row that proves the point: at --jobs 6 its
# p_stat_meta mutants are reported KILLED by test-falsify-generate.sh, and
# sequentially they survive. The damage makes p_stat_meta print FREE-SPACE
# information (`stat -f` on GNU means --file-system), and that test compares two
# p_stat_meta samples taken either side of a generator run — so under concurrent
# workers the free-block count moves between the samples and the assertion trips
# on disk jitter rather than on the branch. Adding that oracle would have
# retired a real gap on the strength of load. The row stays 1:1 deliberately.
#
# EXECUTED-WHOLE is a claim about the mutation UNIT, not about line coverage: a
# script run as `bash <script>` runs top-to-bottom, so the file is the unit even
# though no test drives every branch. EXECUTED-PARTIAL is for a file where only
# some functions are ever reached — a sourced library behind a dispatch guard,
# or a launcher only one of whose modes is exercised.
#
# ── WHY DEFERRED AND EXCLUDED ROWS ARE COMMENTS ───────────────────────────────
# tests/falsify/run.sh reads the UNCOMMENTED rows: those are the tier. A
# deferred target is measured, classified and recorded here — but not yet
# mutated, because activating it needs an increment of its own (a mutant budget,
# a runtime, and in the EXECUTED-PARTIAL cases a per-function mutation unit the
# generator does not yet slice). Recording it as a comment keeps run.sh's active
# set exactly the stage-1 set while leaving nothing undocumented: a deferred row
# still has to name its category, its oracle and its functions, and the gate
# still checks all three against the derivation. Silently omitting it is what
# this format refuses — an omission is indistinguishable from an oversight.
#
# A GREPPED-ONLY row is UNCOMMENTED even though it is never mutated: "never
# mutated" is what its category means, so the row is self-describing data, not
# an exception. run.sh must skip a GREPPED-ONLY row by category.
#
# ── STAGE 1: ACTIVE ───────────────────────────────────────────────────────────
# Entry rule: a dedicated 1:1 oracle test — mechanical, not a judgement call.
# NOTE: that rule alone admits more files than these nine (see the DEFERRED
# block: check-sandbox-version.sh, group.sh, migrate-runme.sh and others each
# have a dedicated oracle too). The nine are the increment-5 stage-1 SET, chosen
# for a bounded first mutant budget; the rule states why each one qualifies, not
# why the others were left out. Their reason is recorded on their own rows.

