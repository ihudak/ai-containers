# tests/falsify/deep.conf — the targets that earned an operator beyond the four
# defaults, and which one (feature-gaps review GAP-4). `run.sh --deep` runs
# exactly these rows, each under ONLY the operators named here; the default
# shards measure the four defaults over the whole corpus.
#
#   <target>|<operators, comma-separated>|<reason: the measured score>
#
# THE ENTRY RULE IS MEASURED, NOT ARGUED. stmt-delete deletes one simple
# statement, the shape of a behaviour silently missing; where an oracle is weak
# it floods the ledger with one gap restated many times. So a target is listed
# only when its oracle already kills at least 90 % of its stmt-delete mutants,
# with no kill that arrived without a FAIL: line (CI holds --max-assertless 0).
# First measurement, 2026-11-03, every active target but repo-git-reset.sh
# (stmt-delete alone, --jobs 10): six cleared it. tests/lib-path-isolation.sh
# (10/11) is left out because its one survivor is the library setting its
# caller's shell options, and tests/lib-layer-checks.sh (207/212) because 5 of
# its kills were assertless. tests/bash-dialect-lint.sh scored 41/42 only while
# the operator still fired inside its RULES array and awk programs; measured
# once it stopped (the review of this change), 20/27, so it is out too. Most
# targets scored 50-80 %: raise an oracle there first, then add the row.
# The scores below are the re-measurement after that fix.
