# tests/layer-checks.conf — every hermetic check, declared ONCE.
#
# Read by tests/lib-verify-repo.sh (which builds each check's stub) and by
# tests/test-layer-containment.sh (which asserts each check's witness). Those
# two previously kept independent hand-written lists, plus a third
# hand-maintained step-count baseline, and nothing made the three agree: adding
# a fourth CI job produced ZERO failures, because the job list was hardcoded as
# three names. This file is the only list; all three are gone.
#
# check|<id>|<job>|<ci_step>|<stub_kind>|<stub_target>|<rc_var>|<witness_target>|<witness_re>
#
#   job          a job id in .github/workflows/hermetic-checks.yml
#   ci_step      that job's step `name:`, matched EXACTLY (not as a substring:
#                the old substring match is what let a filename appearing in a
#                comment satisfy the row)
#   stub_kind    repo-script  executable at <stub-repo>/<stub_target>
#                path-bin     executable at $TMP/bin/<stub_target>, ahead of PATH
#                probe        no stub; plant <stub_target> holding a real syntax
#                             error and read the effect from verify-on-host's log
#                none         no stub; the witness comes from infrastructure
#                             lib-verify-repo.sh creates anyway (the docker stub)
#   rc_var       env var carrying the stub's canned exit code; `-` for none
#   witness_tgt  witness = the shared witness log; log = verify-on-host's output
#   witness_re   an ERE that matches ONLY if the check genuinely ran.
#                @FLOOR_IMAGE@ expands to AI_CONTAINERS_BASH_FLOOR_IMAGE.
#
# setup|<job>|<ci_step>|<why this step is not a check>
#
# Every step of every job in hermetic-checks.yml must appear as one or the
# other. A step that is neither fails tests/test-layer-containment.sh, which is
# what forces a new CI step to be given a layer instead of silently widening the
# PR gate past the local one.
#
# workflow|<file>|<coverage>|<why>
#
#   file       a filename directly under .github/workflows/ (basename only)
#   coverage   classified  every job's steps must be a registry check/setup
#                          row, or the job's own job-level `uses:` must point
#                          at hermetic-checks.yml — the classification loop in
#                          tests/test-layer-containment.sh walks exactly the
#                          files marked classified here (derived, not a
#                          hardcoded list)
#              cases       covered by the integration-case containment section
#                          instead (sel()/run.sh --dry-run), because its steps
#                          are Docker/case orchestration, not hermetic checks
#              exempt      never runs on pull_request, so the local ⊇ nightly
#                          ⊇ PR invariant does not apply to it at all — the
#                          claim is VERIFIED against the file's own `on:`
#                          block (wf_triggers_on), not merely trusted
#
# tests/test-layer-containment.sh enumerates every *.yml file under
# .github/workflows/ from the FILESYSTEM, not by name, and fails by filename if
# one has no `workflow` row here. This closes the branch's fourth and final
# finding in the same class as the other three: the classification loop used
# to walk a hardcoded {hermetic-checks.yml, tests.yml}, so a brand-new
# pull_request-triggered workflow was invisible to it — demonstrated with a
# planted .github/workflows/zz-extra-pr-gate.yml that ran ./tests/run-all.sh on
# every pull_request while this test reported "0 failure(s)".
#
# THIS FILE MUST STAY BYTE-IDENTICAL with mgd-ai-containers' copy — that is
# what lets one copy of the containment guard serve both repos. The two
# repos' .github/workflows/ directories do NOT hold the same filenames (this
# repo also ships release.yml and update-nvm-version.yml; mgd never has, and
# never will, since it doesn't own the public release/nvm-bump automation
# those describe). A `workflow` row therefore does not always name a file
# that exists in the repo currently reading this registry — and the three
# coverage values do not make the same KIND of claim about their file, so a
# missing file is not the same defect for all three:
#
#   classified/cases  a POSITIVE dependency claim — "the guard's
#                      classification loop / case-containment section relies
#                      on this file". If the file is gone, the guard has
#                      silently lost a workflow it thought it was covering:
#                      that is a real defect, and tests/test-layer-containment.sh
#                      fails the row as stale.
#   exempt             a NEGATIVE claim — "this file, IF PRESENT, is not part
#                      of the PR gate". With no file to make that claim about
#                      in THIS repo, there is nothing to be wrong: the row is
#                      inert, not stale, and tests/test-layer-containment.sh
#                      skips it silently rather than failing.
#
# Do not "fix" this by making all three uniform — that is the natural-looking
# edit and it is wrong. Requiring every row's file to exist would make this
# file un-shareable between the two repos (one of them would always fail on
# the other's release/nvm-bump rows); dropping the file-must-exist check
# entirely would let a genuinely stale classified/cases row go undetected,
# which is the exact hand-maintained-list failure mode this whole registry
# exists to close. The asymmetry is the fix, not a compromise.

workflow|hermetic-checks.yml|classified|the reusable workflow both PR-gate callers share; the classification loop walks this file directly and every one of its jobs' steps must be a registry check or declared setup
workflow|tests.yml|classified|the actual PR gate (on: pull_request); its one job calls hermetic-checks.yml via a job-level uses:, and a step added directly to this file must classify too — this is the regression guard for the branch's earlier fix that made a 4th job here visible
workflow|integration.yml|cases|on: pull_request runs the fast integration tier; covered by the integration-case containment section (sel()/run.sh --dry-run) below rather than per-step classification, because its steps are Docker/case orchestration, not hermetic checks
workflow|nightly.yml|cases|schedule/workflow_dispatch only, not pull_request; its hermetic job is asserted directly via wf_job_key above, and its integration-full/packages-* jobs are covered by the nightly case-containment set
workflow|release.yml|exempt|on: push tags only (v[0-9]+.[0-9]+.[0-9]+); publishes a GitHub Release from an existing tag and never runs on pull_request, so nothing here is subject to the containment invariant
workflow|update-nvm-version.yml|exempt|on: schedule/workflow_dispatch only; a maintenance bot that opens its own PR to bump the nvm pin, never itself triggered by pull_request, so the containment invariant does not apply to it

check|hermetic-suite|suite|Run tests|repo-script|tests/run-all.sh|SUITE_RC|witness|^STUB:run-all\.sh$
check|schema-gate|suite|sandbox.conf schema gate|repo-script|check-sandbox-version.sh|SCHEMA_RC|witness|^STUB:check-sandbox-version\.sh$
check|floor-suite|suite-floor|Run tests at the declared floor|none|-|DOCKER_RUN_RC|witness|^STUB:docker-run .*@FLOOR_IMAGE@
check|bash-n|lint|bash -n over every script|probe|tests/broken-syntax-probe.sh|-|log|PARSE ERROR: .*broken-syntax-probe\.sh
check|dialect-lint|lint|bash dialect (nothing newer than the declared floor)|repo-script|tests/bash-dialect-lint.sh|DIALECT_RC|witness|^STUB:bash-dialect-lint\.sh$
check|shellcheck|lint|shellcheck|path-bin|shellcheck|SHELLCHECK_RC|witness|^STUB:shellcheck$
# The falsify mutation tier is TWO rows, not one, deliberately: the corpus run
# and the ledger ratchet are separate scripts and a step that ran only one of
# them must not be able to satisfy the other's witness. Their stubs are named
# by BASENAME (that is what lib-verify-repo.sh's repo-script stub records), so
# `run.sh` here is tests/falsify/run.sh — the witness regexes are anchored
# precisely because `STUB:run-all.sh` and a future registry row for
# tests/integration/run.sh would otherwise be confusable with it.
check|falsify-corpus|falsify|Run the falsify mutation corpus|repo-script|tests/falsify/run.sh|FALSIFY_RUN_RC|witness|^STUB:run\.sh$
check|falsify-ledger|falsify|Survivor-ledger ratchet|repo-script|tests/falsify/check-ledger.sh|FALSIFY_LEDGER_RC|witness|^STUB:check-ledger\.sh$

setup|suite|actions/checkout@v5|clones the repo; runs nothing under test
setup|suite|Show bash version|diagnostic output only
setup|suite|Ensure rsync is available|installs a tool the suite needs
setup|suite-floor|Install git and rsync|installs tools actions/checkout and the suite need inside the container
setup|suite-floor|actions/checkout@v5|clones the repo; runs nothing under test
setup|suite-floor|Trust the checkout: container job's workspace is owned by the runner, not this container's root|git safe.directory for the uid mismatch; runs nothing under test
setup|suite-floor|Show bash version|diagnostic output only
setup|lint|actions/checkout@v5|clones the repo; runs nothing under test
setup|falsify|actions/checkout@v5|clones the repo; runs nothing under test
setup|falsify|Ensure rsync is available|installs a tool one of the tier's oracles (test-shared-files-parity.sh) needs
