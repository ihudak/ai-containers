# Atlassian CLI (acli) — Jira, Confluence, and the other product namespaces it
# ships (admin, assets, guard, rovodev).
#
# Vendor-hosted download, not a GitHub release: Atlassian publishes one tarball
# per OS/arch behind a "latest" URL, so install=url with an ${OS}/${ARCH}
# template is the fit. The archive nests the binary in a version-named directory
# (acli_1.3.22-stable_linux_arm64/acli), which install_url handles by locating
# the binary anywhere inside the archive.
#
# No pinning is possible: every documented package URL goes through /latest/
# (a versioned path returns 403), and each release is supported for 6 months.
# So the sandbox.conf grammar is ON | OFF, and `acli --version` tells you what
# you got. acli is baked at build time (unlike the runtime-installed agent-tier
# tools), so refreshing it means rebuilding: `./build.sh --no-cache` (there is
# no pinned version to bump instead).
#
# Telemetry: the binary embeds a Segment analytics client (https://api.segment.io
# is compiled in; no opt-out flag exists in 1.3.22). That host is deliberately
# NOT allowlisted, so telemetry fails closed inside the restricted container.
#
# Its entire state — profiles AND credentials — lives in ~/.config/acli
# (global_auth_config.yaml plus one config file per product namespace). The
# binary is static and needs no OS keyring, so a headless container login
# persists there and is group-scoped by config_dir:
#   echo "$TOKEN" | acli jira auth login --email you@example.com \
#       --site your-org.atlassian.net --token
# Authenticate once per container group; every later container reuses it.
binary=acli
install=url
url=https://acli.atlassian.com/${OS}/latest/acli_${OS}_${ARCH}.tar.gz
config_dir=.config/acli
allowlist_fragment=atlassian
skills=no
